services:
  backend:
    image: bot-chat-backend:dev
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    command: uv run fastapi dev src/api/main.py --host 0.0.0.0 --port 8000
    networks:
      - back_tier_network
      - front_tier_network

    depends_on:
      - DB

    restart: on-failure

  DB:
    # Explicit Postgres image to satisfy compose requirements
    image: postgres:16-alpine
    container_name: db
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - back_tier_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      DB:
        condition: service_healthy
    networks:
      - back_tier_network
      - front_tier_network

  # -----------------------------------------------------------------------------
  # Frontend service
  #
  # This service runs the Next.js based UI that demonstrates how to consume the
  # API exposed by the FastAPI backend.  During development the container
  # runs `npm run dev` to enable hot-reloading.  The `BACKEND_URL`
  # environment variable tells the frontend where to find the API on the docker
  # network.  The port 3000 on the host exposes the development server.
  frontend:
    image: bot-chat-frontend
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev # select the dev stage from the Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - BACKEND_URL=${FRONTEND_BACKEND_URL}
      - BACKEND_CHAT_PATH=${FRONTEND_BACKEND_CHAT_PATH}
      - BACKEND_TITLE_PATH=${FRONTEND_BACKEND_TITLE_PATH}
      - NEXT_PUBLIC_FRONTEND_API_BASE=${NEXT_PUBLIC_FRONTEND_API_BASE}
      - NODE_ENV=development
    command: npm run dev

    networks:
      - front_tier_network

  nginx:
    image: nginx:1.27
    container_name: nginx
    volumes:
      - ./infra/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - pgadmin
    networks:
      - front_tier_network

volumes:
  db_data:
    driver: local # Defines a volume for storing PostgreSQL data persistently

networks:
  back_tier_network:
    driver: bridge # Creates an internal bridge network for isolated service communication
    internal: true
  front_tier_network:
    driver: bridge
