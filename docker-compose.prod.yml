services:
  app:
    image: bot-chat-backend
    container_name: bot-chat-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner # select the runner stage from the Dockerfile
    environment:
      - BACKEND_ENVIRONMENT=prod
    networks:
      - front_tier_network
    restart: always

  # -----------------------------------------------------------------------------
  # Frontend service
  #
  # The production frontend is a Next.js application that consumes the API
  # exposed by the FastAPI backend.  It runs using the default `npm start`
  # command defined in the Dockerfile, which serves the compiled static
  # application on port 3000.  The `BACKEND_URL` environment variable
  # points to the backend service on the internal Docker network.
  frontend:
    image: bot-chat-frontend
    container_name: bot-chat-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner # select the runner stage from the Dockerfile
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    networks:
      - front_tier_network
    restart: always # Ensure the service restarts on failure for reliability

  # Frontend service for production.  The Next.js UI is built from
  # the `frontend` directory and served on port 3000.  It points to
  # the backend on the same Docker network.  This service can be
  # fronted by an external load balancer or reverse proxy if
  # required.

  nginx:
    image: nginx:stable-alpine
    container_name: bot-chat-nginx
    volumes:
      - ./infra/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - frontend
    networks:
      - front_tier_network
    restart: always

networks:
  front_tier_network:
    driver: bridge
